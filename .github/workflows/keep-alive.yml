# Keeps the Kavach API awake during Indian waking hours so a worried user doesn't wait ~50 s for a cold start.
# Render's free tier sleeps after 15 idle minutes and gives 750 instance-hours a month to ALL free services in the
# workspace, so this pings only 06:30-23:30 IST (~527 h/month) and leaves the rest for the other services, which
# still wake on demand. GitHub runs scheduled jobs on a best-effort basis (sometimes minutes late) and pauses them
# after 60 days without repository activity; re-enable from the Actions tab if that happens.
name: keep-alive

on:
  schedule:
    - cron: "*/10 1-17 * * *" # every 10 min, 01:00-17:59 UTC = 06:30-23:29 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Kavach API
        env:
          API_URL: ${{ vars.KAVACH_API_URL || 'https://kavach-api.onrender.com' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 90 "$API_URL/health"; then echo; exit 0; fi
            sleep 20
          done
          echo "Kavach API did not answer" && exit 1
